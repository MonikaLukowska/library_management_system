services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_management_system_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_management_system_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    command: ["./bin/rails", "server"]
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      BINDING: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@db:5432/library_management_system_development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres_data:
